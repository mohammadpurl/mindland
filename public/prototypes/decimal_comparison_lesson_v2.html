<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مایندلند — مقایسه اعداد اعشاری (V2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1530; --ink-2:#151B3B; --panel:#1B2247; --panel-2:#232B58;
    --line: rgba(245,243,234,0.10); --line-strong: rgba(245,243,234,0.20);
    --teal:#4FD1AE; --teal-dim: rgba(79,209,174,0.14);
    --coral:#FF7A6E; --coral-dim: rgba(255,122,110,0.14);
    --purple:#6C4CF1; --purple-dim: rgba(108,76,241,0.16);
    --blue:#2F80ED; --blue-dim: rgba(47,128,237,0.16);
    --yellow:#FFC83D; --yellow-dim: rgba(255,200,61,0.18);
    --text:#F4F2EA; --muted:#98A0C4; --muted-2:#6B7299;
    --radius-lg:24px; --radius-md:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(47,128,237,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(108,76,241,0.10), transparent 60%),
      var(--ink);
    color:var(--text); font-family:'Vazirmatn', Tahoma, sans-serif; min-height:100vh; line-height:1.65;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .shell{ max-width:920px; margin:0 auto; padding:22px 22px 70px; position:relative; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; }
  .brand-mark{ width:28px;height:28px;border-radius:8px; background:linear-gradient(135deg, var(--purple), var(--blue)); display:flex;align-items:center;justify-content:center; font-size:14px; }
  .crumb{ font-size:13px; color:var(--muted); }

  .progress-wrap{ margin-bottom:14px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .progress-bar{ height:6px; border-radius:6px; background:var(--panel-2); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--purple), var(--blue)); border-radius:6px; transition:width .4s ease; }

  .phase-row{ display:flex; justify-content:center; margin-bottom:14px; }
  .phase-badge{ display:inline-flex; align-items:center; gap:6px; background:var(--purple-dim); border:1px solid rgba(108,76,241,0.4); color:#D9CFFF; font-size:12px; font-weight:700; padding:5px 14px; border-radius:999px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:32px 28px; min-height:400px; display:flex; flex-direction:column; }
  .eyebrow{ color:var(--purple); font-size:13px; font-weight:700; margin-bottom:10px; text-align:center; }
  h1.q{ font-size:22px; font-weight:700; margin:0 0 22px; line-height:1.6; text-align:center; }
  p.sub{ color:var(--muted); font-size:14px; margin:0 0 18px; text-align:center; }
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }

  .purpose-tag{ display:flex; align-items:center; gap:8px; background:var(--ink-2); border:1px dashed var(--line-strong); border-radius:10px; padding:8px 14px; font-size:12.5px; color:var(--muted); margin-bottom:16px; }
  .purpose-tag b{ color:var(--blue); font-weight:700; }

  .teacher-note{ display:flex; gap:12px; align-items:flex-start; background:var(--blue-dim); border:1.5px solid rgba(47,128,237,0.35); border-radius:var(--radius-md); padding:14px 18px; width:100%; max-width:560px; }
  .teacher-icon{ font-size:20px; flex-shrink:0; }
  .teacher-note .txt b{ display:block; font-size:11.5px; color:var(--blue); margin-bottom:3px; font-weight:700; }
  .teacher-note .txt p{ margin:0; font-size:14px; }
  .teacher-note.reacting{ border-color:var(--teal); background:var(--teal-dim); }
  .teacher-note.reacting .txt b{ color:var(--teal); }

  .why-block{ width:100%; max-width:520px; background:var(--yellow-dim); border:1.5px solid rgba(255,200,61,0.4); border-radius:var(--radius-md); padding:16px; }
  .why-block .why-eyebrow{ font-size:12.5px; font-weight:800; color:var(--yellow); margin-bottom:10px; }

  /* ---------- compare cards ---------- */
  .cards-row{ display:flex; gap:20px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .num-card{
    background:var(--ink-2); border:2px solid var(--line-strong); border-radius:20px;
    padding:26px 36px; font-family:'JetBrains Mono', monospace; font-size:38px; font-weight:700;
    cursor:pointer; transition:all .18s ease; min-width:150px; text-align:center; direction:ltr;
  }
  .num-card:hover{ border-color:var(--muted-2); transform:translateY(-2px); }
  .num-card.correct{ border-color:var(--teal); background:var(--teal-dim); color:var(--teal); }
  .num-card.wrong{ border-color:var(--coral); background:var(--coral-dim); color:var(--coral); }
  .num-card.disabled{ pointer-events:none; }
  .vs-mark{ font-size:22px; color:var(--muted-2); font-weight:700; }

  /* ---------- place value ---------- */
  .pv-block{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .pv-number{ font-family:'JetBrains Mono', monospace; font-size:32px; font-weight:700; direction:ltr; }
  .pv-cols{ display:flex; gap:8px; direction:ltr; }
  .pv-col{
    width:64px; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 6px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--ink-2);
    cursor:pointer; transition:all .18s ease;
  }
  .pv-col:hover{ border-color:var(--muted-2); }
  .pv-col.active{ border-color:var(--yellow); background:var(--yellow-dim); transform:scale(1.08); }
  .pv-col .digit{ font-family:'JetBrains Mono', monospace; font-size:24px; font-weight:700; }
  .pv-col .digit.ghost{ color:var(--muted-2); }
  .pv-col .label{ font-size:10.5px; color:var(--muted); }
  .pv-tooltip{ font-size:13px; color:var(--yellow); font-weight:700; min-height:18px; }

  .rows-wrap{ display:flex; flex-direction:column; gap:22px; align-items:center; }

  /* ---------- number line ---------- */
  .numberline-wrap{ width:100%; padding:20px 10px 30px; }
  .nl-point{ cursor:pointer; }
  .nl-point circle{ transition:r .15s ease; }
  .nl-point:hover circle{ r:9; }

  /* ---------- shop ---------- */
  .shop-row{ display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
  .shop-card{
    background:var(--ink-2); border:2px solid var(--line-strong); border-radius:18px; padding:20px 26px;
    text-align:center; cursor:pointer; transition:all .18s ease; min-width:150px;
  }
  .shop-card:hover{ border-color:var(--muted-2); }
  .shop-card .pencil{ font-size:34px; margin-bottom:8px; }
  .shop-card .price{ font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700; direction:ltr; }
  .shop-card.correct{ border-color:var(--teal); background:var(--teal-dim); }
  .shop-card.wrong{ border-color:var(--coral); background:var(--coral-dim); }
  .shop-card.disabled{ pointer-events:none; }

  .diff-input-row{ display:flex; gap:10px; align-items:center; justify-content:center; margin-top:14px; }
  .diff-input{
    font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; text-align:center;
    background:var(--ink-2); border:1.5px solid var(--teal); border-radius:12px; color:var(--text);
    padding:10px 14px; width:120px; direction:ltr; outline:none;
  }
  .num-input{ font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700; text-align:center; background:var(--ink-2); border:1.5px solid var(--teal); border-radius:12px; color:var(--text); padding:10px 16px; width:150px; direction:ltr; outline:none; }
  .textarea-box{ width:100%; max-width:520px; background:var(--ink-2); border:1.5px solid var(--line); border-radius:var(--radius-md); color:var(--text); font-family:inherit; font-size:14px; padding:12px 14px; resize:vertical; min-height:70px; outline:none; }

  /* ---------- options / mcq ---------- */
  .options-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:420px; }
  .opt{ padding:14px; background:var(--ink-2); border:1.5px solid var(--line); border-radius:var(--radius-md); cursor:pointer; text-align:center; font-size:14.5px; font-weight:600; transition:all .15s ease; }
  .opt:hover{ border-color:var(--muted-2); }
  .opt.correct{ border-color:var(--teal); background:var(--teal-dim); color:var(--teal); }
  .opt.wrong{ border-color:var(--coral); background:var(--coral-dim); color:var(--coral); }
  .opt.disabled{ pointer-events:none; }

  .rule-box{
    margin-top:18px; background:var(--purple-dim); border:1.5px solid rgba(108,76,241,0.4);
    border-radius:var(--radius-md); padding:16px 20px; font-size:14px; text-align:center; line-height:2;
    display:none;
  }
  .rule-box.show{ display:block; }

  .feedback{ margin-top:16px; padding:12px 18px; border-radius:var(--radius-md); font-size:14px; text-align:center; display:none; border:1.5px solid transparent; max-width:520px; }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--teal-dim); border-color:var(--teal); color:var(--teal); }
  .feedback.err{ background:var(--coral-dim); border-color:var(--coral); color:#FFC9C2; }
  .feedback.info{ background:var(--purple-dim); border-color:var(--purple); color:#D9CFFF; }
  .feedback.remedial{ background:var(--yellow-dim); border-color:var(--yellow); color:var(--yellow); }

  /* ---------- chips (final mission) ---------- */
  .mission-chip{
    font-family:'JetBrains Mono', monospace; font-size:28px; font-weight:700;
    background:var(--ink-2); border:2px solid var(--line-strong); border-radius:16px;
    padding:16px 26px; cursor:pointer; transition:all .18s ease; direction:ltr;
  }
  .mission-chip:hover{ border-color:var(--muted-2); }
  .mission-chip.selected{ border-color:var(--yellow); background:var(--yellow-dim); }
  .mission-chip.correct{ border-color:var(--teal); background:var(--teal-dim); color:var(--teal); }
  .mission-chip.wrong{ border-color:var(--coral); background:var(--coral-dim); color:var(--coral); }

  /* ---------- summary / report ---------- */
  .status-grid{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:460px; }
  .status-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14px; background:var(--ink-2); border-radius:10px; padding:9px 14px; }
  .status-row .level{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .status-row .level.strong{ background:var(--teal-dim); color:var(--teal); }
  .status-row .level.practice{ background:var(--yellow-dim); color:var(--yellow); }
  .next-step-box{ width:100%; max-width:520px; background:var(--blue-dim); border:1.5px solid rgba(47,128,237,0.4); border-radius:var(--radius-md); padding:14px 18px; font-size:14px; }
  .next-step-box b{ display:block; color:var(--blue); font-size:12px; margin-bottom:4px; }

  .checklist{ display:flex; flex-direction:column; gap:10px; margin-top:10px; width:100%; max-width:400px; }
  .check-item{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .check-item .tick{ width:20px;height:20px;border-radius:50%; background:var(--teal); color:#062A22; display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }

  /* ---------- adaptive state strip ---------- */
  .state-strip{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .state-dot{ font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--ink-2); border:1px solid var(--line-strong); color:var(--muted-2); }
  .state-dot.reached{ color:var(--teal); border-color:var(--teal); }
  .state-dot.active{ color:#052620; background:var(--teal); border-color:var(--teal); }

  /* ---------- nav ---------- */
  .actions{ display:flex; justify-content:space-between; margin-top:26px; gap:10px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:12px; border:none; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; transition:transform .12s ease, filter .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-primary:disabled{ background:var(--panel-2); color:var(--muted-2); cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--text); border:1.5px solid var(--line-strong); }
  .btn-ghost:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-soft{ background:var(--purple-dim); color:#D9CFFF; border:1.5px solid rgba(108,76,241,0.4); }

  /* ---------- Nava corner ---------- */
  .nava-corner{ position:fixed; bottom:22px; left:22px; display:flex; align-items:flex-end; gap:10px; z-index:50; }
  .nava-bubble{
    background:var(--panel-2); border:1px solid var(--line-strong); border-radius:14px; border-bottom-left-radius:4px;
    padding:9px 15px; font-size:13.5px; font-weight:600; max-width:230px;
    opacity:0; transform:translateY(6px) scale(.95); transition:all .3s ease; margin-bottom:6px;
  }
  .nava-bubble.show{ opacity:1; transform:translateY(0) scale(1); }
  .nava{ width:56px; height:60px; position:relative; flex-shrink:0; }
  .nava .antenna{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:3px; height:10px; background:var(--muted-2); }
  .nava .antenna::before{ content:''; position:absolute; top:-5px; left:50%; transform:translateX(-50%); width:7px; height:7px; border-radius:50%; background:var(--purple); box-shadow:0 0 8px var(--purple); }
  .nava .head{ position:absolute; top:0; left:5px; width:46px; height:34px; border-radius:12px; background:linear-gradient(160deg,#3A4482,#232B55); border:2px solid var(--line-strong); }
  .nava .eye{ position:absolute; top:13px; width:7px; height:7px; border-radius:50%; background:var(--teal); transition:all .2s ease; }
  .nava .eye.l{ left:13px; } .nava .eye.r{ right:13px; }
  .nava .body{ position:absolute; bottom:0; left:9px; width:38px; height:26px; border-radius:10px; background:var(--panel-2); border:2px solid var(--line-strong); }
  .nava.happy .eye{ background:var(--teal); box-shadow:0 0 6px var(--teal); }
  .nava.happy{ animation:navaBounce .5s ease; }
  @keyframes navaBounce{ 0%,100%{transform:translateY(0);} 40%{transform:translateY(-6px);} }
  .nava.confused .eye.l{ top:11px; } .nava.confused .eye.r{ top:15px; }
  .nava.confused .eye{ background:var(--yellow); }
  .nava.confused{ animation:navaTilt .4s ease; }
  @keyframes navaTilt{ 0%,100%{transform:rotate(0);} 50%{transform:rotate(-6deg);} }

  /* ---------- modals ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(6,9,22,0.75); display:none; align-items:center; justify-content:center; z-index:300; padding:20px; }
  .modal-overlay.show{ display:flex; }
  .modal-box{ background:var(--panel); border:1px solid var(--line-strong); border-radius:20px; max-width:580px; width:100%; max-height:85vh; overflow-y:auto; padding:26px; }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-header h2{ margin:0; font-size:17px; }
  .modal-close{ background:var(--ink-2); border:1px solid var(--line-strong); color:var(--text); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; }
  .modal-box h3{ font-size:13.5px; color:var(--blue); margin:18px 0 8px; }
  .modal-box p, .modal-box li{ font-size:13.5px; color:var(--text); line-height:1.9; }
  .modal-box ul{ margin:0; padding-inline-start:20px; }
  .parent-line{ display:flex; justify-content:space-between; gap:10px; background:var(--ink-2); border-radius:10px; padding:9px 14px; margin-bottom:8px; font-size:13.5px; }

  .dev-link{ text-align:center; font-size:12px; color:var(--muted-2); margin-top:26px; cursor:pointer; text-decoration:underline dotted; }
  .bonus-toggle{ text-align:center; font-size:12.5px; color:var(--blue); margin-top:16px; cursor:pointer; text-decoration:underline; }

  @media (max-width:560px){
    .num-card{ font-size:28px; padding:18px 22px; min-width:110px; }
    .nava-corner{ left:10px; bottom:10px; }
    .nava-bubble{ max-width:170px; font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">🔢</div>مایندلند</div>
    <div class="crumb">ریاضی ششم / مقایسه اعداد اعشاری · V2</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label"><span id="pageLabel">مأموریت مقایسه اعشار</span><span id="pagePct">۰٪</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="phase-row"><div class="phase-badge" id="phaseBadge"></div></div>

  <div class="card" id="stage"></div>
  <div class="dev-link" id="devNotesLink">🛠 یادداشت طراح و توسعه‌دهنده</div>
</div>

<div class="nava-corner">
  <div class="nava-bubble" id="navaBubble"></div>
  <div class="nava" id="navaEl">
    <div class="antenna"></div>
    <div class="head"><div class="eye l"></div><div class="eye r"></div></div>
    <div class="body"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
function toFa(n){ return String(n).replace(/\./g,'٫').replace(/[0-9]/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function faToEn(s){ const fa='۰۱۲۳۴۵۶۷۸۹'; return String(s).replace(/[۰-۹]/g, d=>fa.indexOf(d)).replace(/٫/g,'.'); }
function el(tag, cls, html){ const e=document.createElement(tag); e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function cmp(a,b){ const A=Math.round(a*100), B=Math.round(b*100); return A>B?1:(A<B?-1:0); }

const navaEl = document.getElementById('navaEl');
const navaBubble = document.getElementById('navaBubble');
let navaTimer = null;
function navaSay(text, mood){
  navaBubble.textContent = text;
  navaBubble.classList.add('show');
  navaEl.className = 'nava' + (mood?(' '+mood):'');
  clearTimeout(navaTimer);
  navaTimer = setTimeout(()=> navaBubble.classList.remove('show'), 4200);
}
function teacherNote(label, text, reacting){
  return el('div','teacher-note'+(reacting?' reacting':''), `<div class="teacher-icon">🧑‍🏫</div><div class="txt"><b>${label}</b><p>${text}</p></div>`);
}
function purposeTag(text){
  return el('div','purpose-tag', `<span>🎯</span><span><b>هدف این تعامل:</b> ${text}</span>`);
}

const PHASE_LABELS = {
  goal:'🎯 هدف یادگیری', predict:'🔮 پیش‌بینی کن', discover:'🔍 کشف کن', explain:'📘 یاد بگیر',
  interact:'🖐 تعامل کن', practice:'✍️ تمرین کن', diagnose:'🧭 بررسی مسیر', remediate:'🩹 مرور ساده‌تر',
  apply:'🧰 به‌کار ببند', create:'✨ بساز', explainback:'🗣 توضیح بده', assess:'📝 ارزیابی', report:'📊 گزارش'
};
function setPhase(key){ document.getElementById('phaseBadge').textContent = PHASE_LABELS[key] || ''; }

/* ---------------- Global learning state ---------------- */
const state = {
  concepts: {
    wholePart:  { label:'مقایسه‌ی بخش صحیح', attempts:0, wrong:0, hints:0 },
    zeroPad:    { label:'صفر انتهایی و ارزش عدد', attempts:0, wrong:0, hints:0 },
    digitByDigit: { label:'مقایسه رقم‌به‌رقم (دهم، صدم)', attempts:0, wrong:0, hints:0, remedialTriggered:false, remedialRecovered:false },
    application: { label:'کاربرد در مسئله واقعی', attempts:0, wrong:0, hints:0 }
  },
  navaMistakeCaught: null,
  explainBackDone: false,
  finalAnswers: [],
  hintsUsedTotal: 0
};
function attemptConcept(k){ if(state.concepts[k]) state.concepts[k].attempts++; }
function logWrong(k){ if(state.concepts[k]){ state.concepts[k].wrong++; state.concepts[k].hints++; state.hintsUsedTotal++; } }
function resetState(){
  Object.values(state.concepts).forEach(c=>{ c.attempts=0; c.wrong=0; c.hints=0; if('remedialTriggered' in c){c.remedialTriggered=false; c.remedialRecovered=false;} });
  state.navaMistakeCaught=null; state.explainBackDone=false; state.finalAnswers=[]; state.hintsUsedTotal=0;
}

let currentPage = 0;
const TOTAL = 13;
const stage = document.getElementById('stage');
const pageLabel = document.getElementById('pageLabel');
const pagePct = document.getElementById('pagePct');
const progressFill = document.getElementById('progressFill');

function goTo(i){
  currentPage = Math.max(0, Math.min(TOTAL-1, i));
  const pct = Math.round((currentPage/(TOTAL-1))*100);
  progressFill.style.width = pct+'%';
  pagePct.textContent = toFa(pct)+'٪';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function navButtons(canNext, nextLabel, onNext){
  const wrap = el('div','actions');
  const prev = el('button','btn btn-ghost','قبلی');
  prev.disabled = currentPage===0;
  prev.onclick = ()=> goTo(currentPage-1);
  const next = el('button','btn btn-primary', nextLabel||'ادامه →');
  next.id='nextBtn'; next.disabled = !canNext;
  next.onclick = ()=>{ if(onNext) onNext(); goTo(currentPage+1); };
  wrap.appendChild(prev); wrap.appendChild(next);
  return wrap;
}

function buildMCQ(container, {options, correctIndex, correctMsg, wrongHints, concept, onDone}){
  if(concept) attemptConcept(concept);
  const optWrap = el('div','options-grid');
  let hintStage = 0;
  options.forEach((text,i)=>{
    const opt = el('div','opt', text);
    opt.onclick = ()=>{
      if(i===correctIndex){
        Array.from(optWrap.children).forEach(x=>x.classList.add('disabled'));
        opt.classList.add('correct');
        fb.className='feedback show ok'; fb.textContent = correctMsg;
        navaSay('درسته!','happy');
        if(onDone) onDone(true, hintStage);
      } else {
        if(concept) logWrong(concept);
        opt.classList.add('wrong');
        setTimeout(()=> opt.classList.remove('wrong'), 700);
        fb.className='feedback show info';
        fb.textContent = wrongHints[Math.min(hintStage, wrongHints.length-1)];
        navaSay('یه بار دیگه فکر کن','confused');
        hintStage = Math.min(hintStage+1, wrongHints.length-1);
        if(onDone) onDone(false, hintStage);
      }
    };
    optWrap.appendChild(opt);
  });
  const fb = el('div','feedback');
  container.appendChild(optWrap);
  container.appendChild(fb);
  return {optWrap, fb};
}
function whyBlock(container, {question, options, correctIndex, msg, concept}){
  const box = el('div','why-block');
  box.appendChild(el('div','why-eyebrow','🤔 چرا؟'));
  const qEl = el('div','', question); qEl.style.cssText='font-size:14.5px;font-weight:700;margin-bottom:10px;';
  box.appendChild(qEl);
  container.appendChild(box);
  buildMCQ(box, { options, correctIndex, correctMsg: msg, wrongHints:['دوباره به دلیل زیرینش فکر کن، نه فقط جواب.'], concept });
}

    const wrap = el('div','pv-block');

    { a:'6.5', b:'6.50', q:'کدوم عدد بزرگ‌تره؟', opts:['۶٫۵','۶٫۵۰','با هم برابرن'], correct:'با هم برابرن',
      msg:'این دو تا مقدارشون یکیه! ۶٫۵ = ۶٫۵۰' },
  ];
  const easyRound = { a:'2.1', b:'2.9', q:'یه دور ساده‌تر: کدوم عدد بزرگ‌تره؟', opts:['۲٫۱','۲٫۹'], correct:'۲٫۹',

  let r = 0;
  let wrongInRow = 0;

  const reached = new Set();
  const nav = navButtons(false);
  const stripHolder = el('div','');

  function drawStrip(k){ stripHolder.innerHTML=''; renderStateStrip(stripHolder, k, reached); }

  function renderRound(info, isEasy){
    const old = stage.querySelector('#roundArea');
    if(old) old.remove();
    const area = el('div','','');
    area.id='roundArea';
    const label = isEasy ? 'مسیر ساده‌تر (Guided Practice)' : `دور ${toFa(r+1)} از ${toFa(rounds.length)}`;
    area.innerHTML = `<div style="text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:10px;">${label}</div>`;

    attemptConcept('digitByDigit');
    const optWrap = el('div','options-grid');
    info.opts.forEach(o=>{
      const opt = el('div','opt', o);
      opt.onclick = ()=>{
        Array.from(optWrap.children).forEach(x=>x.classList.add('disabled'));
        if(o===info.correct){
          opt.classList.add('correct');
          navaSay('آفرین!','happy');
          wrongInRow = 0;
          reached.add(isEasy?'E':'A');
          drawStrip(isEasy?'E':'A');
        } else {
          logWrong('digitByDigit');
          opt.classList.add('wrong');
          Array.from(optWrap.children).find(x=>x.textContent===info.correct).classList.add('correct');
          navaSay('یه لحظه فکر کن...','confused');
          if(!isEasy){
            wrongInRow++;
            reached.add(wrongInRow===1?'B':'C');
            drawStrip(wrongInRow===1?'B':'C');
          }

        const fb = el('div','feedback show ok', info.msg);
        c.appendChild(fb);
        const needEasy = !isEasy && wrongInRow>=2 && !insertedEasy;
        if(needEasy){
          insertedEasy = true;
          reached.add('D');
          state.concepts.digitByDigit.remedialTriggered = true;
          const remedyBtn = el('button','btn btn-primary','یه مثال ساده‌تر ببینیم →');
          remedyBtn.style.marginTop='16px';
          remedyBtn.onclick = ()=>{ setPhase('remediate'); drawStrip('D'); renderRound(easyRound, true); };
          c.appendChild(remedyBtn);
        } else if(isEasy){
          if(o===info.correct) state.concepts.digitByDigit.remedialRecovered = true;
          const backBtn = el('button','btn btn-primary','برگردیم به دور اصلی →');
          backBtn.style.marginTop='16px';

          setTimeout(()=> nav.querySelector('#nextBtn').disabled = false, 10);

        }
      };
      optWrap.appendChild(opt);
    });
    c.appendChild(optWrap);
    area.appendChild(c);
    stage.insertBefore(area, nav);
  }
  stage.appendChild(purposeTag('تشخیص سریع اینکه کدوم رقم واقعاً «تعیین‌کننده» است — این مسیر با خطاهای متوالی، ساده‌تر می‌شه.'));

/* ================= PAGE 12 : Report ================= */
function skillLevel(key){
  const c = state.concepts[key];
  if(!c || c.attempts===0) return 'strong';
  const wrongRatio = c.wrong / Math.max(1,c.attempts);
  if(c.remedialTriggered && !c.remedialRecovered) return 'practice';
  if(wrongRatio > 0.5) return 'practice';
  return 'strong';
}
function weakestConceptKey(){
  const order = ['digitByDigit','zeroPad','wholePart','application'];
  for(const k of order){ if(skillLevel(k)==='practice') return k; }
  return null;
}

    <h3>Stateهای موجود (Mock)</h3>
    <p>در بخش «بازی رقم برنده»، پنج وضعیت قابل مشاهده تعریف شده: A) پاسخ درست، B) اشتباه اول، C) اشتباه دوم، D) نمایش دور ساده‌تر (Guided Practice)، E) بازگشت موفق به دور اصلی. این وضعیت‌ها با یک نوار رنگی بالای صفحه نمایش داده می‌شن.</p>
    <h3>مسیر تطبیقی (Adaptive Path)</h3>
    <p>Hard Problem → Hint → Second Error → Simpler Example → Guided Practice → Similar Problem → Return to Original Difficulty. اگر دانش‌آموز در یک دور، دو بار پشت سر هم اشتباه کنه، یک دور ساده‌تر (مثلاً ۲٫۱ در برابر ۲٫۹) نشون داده می‌شه؛ بعد از پاسخ درست به اون، به همون دور اصلی برمی‌گرده. در نسخه‌ی واقعی این منطق باید با داده‌های واقعی عملکرد و یک موتور تطبیقی واقعی جایگزین بشه.</p>
    <h3>نقش معلم</h3>
    <p>معلم قبل از توضیح دادنِ مستقیمِ قانون مقایسه یا صفر انتهایی، از دانش‌آموز می‌خواد حدس بزنه، و بعد از پاسخ او، با یک توضیح متناسب واکنش نشون می‌ده (Teacher → Student → Teacher) — مثلاً در کشف قانون «از کجا شروع کنیم؟».</p>
    <h3>نقش ناوا</h3>
    <p>ناوا همراه یادگیریه، نه معلم اصلی. او در لحظات کلیدی سؤال می‌پرسه، وقتی خطای متوالی می‌بینه مسیر رو ساده‌تر می‌کنه، و در طول درس واکنش‌های احساسی (happy/confused) نشون می‌ده که به دانش‌آموز بازخورد بدون قضاوت می‌ده. ناوا در همه‌ی صفحات حضور پررنگ نداره و در بخش‌های آموزشی اصلی (مثل کشف قانون) جای خودش رو به معلم می‌ده.</p>
  `;
